<!DOCTYPE html>
<html>

<head>
	<script defer src="/dist/bundle.js"></script>
	<link rel="stylesheet" href="/style.css" />
</head>

<body>
	<div id="login-view" class="view hidden">
		<div class="card">
			<h2>Login</h2>
			<div><b>Name: </b><input /></div>
			<button class="operation-button">Enter</button>
		</div>
	</div>

	<div id="lobby-list-view" class="view hidden">
		<div class="card">
			<h2>Lobbies</h2>
			<div>
				<input class="new-lobby-input" placeholder="New lobby name" />
				<button class="new-lobby-button operation-button">Add lobby</button>
			</div>
			<div class="lobby-list"></div>
		</div>
	</div>

	<div id="main-view" class="view hidden"></div>

	<div id="snackbar-block"></div>
</body>

</html>
